# ════════════════════════════════════════════════
# APPLICATION
# ════════════════════════════════════════════════
spring.application.name=LibraryManagementSystem
server.port=8080

# ════════════════════════════════════════════════
# DATABASE
# ════════════════════════════════════════════════
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-104945ba-akramakrama538-7e0e.d.aivencloud.com:17329/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ════════════════════════════════════════════════
# JPA / HIBERNATE
# ════════════════════════════════════════════════
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# fix lazy loading issues
spring.jpa.open-in-view=false

# ════════════════════════════════════════════════
# JWT
# ════════════════════════════════════════════════
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.prefix=Bearer
jwt.header=Authorization

# ════════════════════════════════════════════════
# REDIS CACHE
# ════════════════════════════════════════════════
# Redis (Upstash)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# cache config
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.key-prefix=library:
spring.cache.redis.use-key-prefix=true
spring.cache.redis.cache-null-values=false

# ════════════════════════════════════════════════
# FILE UPLOAD
# ════════════════════════════════════════════════
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

file.upload-dir=uploads/covers
file.allowed-types=image/jpeg,image/png,image/gif,image/webp
file.max-size=5242880
file.base-url=http://localhost:8080/api/files

# ════════════════════════════════════════════════
# EMAIL
# ════════════════════════════════════════════════
# ─── for local testing (MailHog/Mailtrap) ──────
#spring.mail.host=localhost
#spring.mail.port=1025
#spring.mail.username=
#spring.mail.password=
#spring.mail.properties.mail.smtp.auth=false
#spring.mail.properties.mail.smtp.starttls.enable=false

# ─── for real email (Gmail SMTP) ───────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=youremail@gmail.com
spring.mail.password=yourgmailapppassword
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# custom email config
app.email.from=youremail@gmail.com
app.email.from-name=Library Management System
app.email.enabled=true

# ════════════════════════════════════════════════
# ASYNC + SCHEDULING
# ════════════════════════════════════════════════
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=email-thread-

spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduler-

# ════════════════════════════════════════════════
# ACTUATOR
# ════════════════════════════════════════════════
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always

# disable unwanted health checks
management.health.diskspace.enabled=false
management.health.ping.enabled=false
management.health.ssl.enabled=false
management.health.redis.enabled=true
management.health.db.enabled=true
management.health.mail.enabled=false

# ════════════════════════════════════════════════
# APP INFO (shows in /actuator/info)
# ════════════════════════════════════════════════
info.app.name=Library Management System
info.app.version=1.0.0
info.app.description=Complete Library REST API
info.app.author=Akram
info.app.email=akram@gmail.com

# ════════════════════════════════════════════════
# SWAGGER / OpenAPI
# ════════════════════════════════════════════════
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.groups-order=asc

# show actuator in swagger
springdoc.show-actuator=false

# ════════════════════════════════════════════════
# LOGGING
# ════════════════════════════════════════════════
logging.level.root=INFO
logging.level.org.example.librarymanagementsystem=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# log file
logging.file.name=logs/library.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.file-name-pattern=logs/library-%d{yyyy-MM-dd}.log

# log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
